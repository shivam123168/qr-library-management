<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Student Login · LibraryOS</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="login.css">
    <style>
        /* Student accent — indigo */
        :root {
            --accent:      #6366F1;
            --accent-dim:  rgba(99,102,241,0.13);
            --accent-glow: rgba(99,102,241,0.22);
        }
    </style>
</head>
<body>

<div class="login-wrapper">

    <!-- Left: Visual panel -->
    <div class="login-visual">
        <img class="bg-img" src="../images/Student login Image.jpeg" alt="Library background">
        <div class="bg-overlay"></div>
        <div class="visual-content">
            <div class="visual-badge">
                <i class="fas fa-graduation-cap"></i> LibraryOS — Student Portal
            </div>
            <h1>Read more,<br><span>grow</span> further.</h1>
            <p>Access your borrowed books, track deadlines, and manage requests — all in one student portal.</p>
            <div class="visual-dots">
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <!-- Right: Form panel -->
    <div class="login-panel">
        <div class="login-header">
            <div class="portal-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h2>Student Login</h2>
            <p>Sign in with your PRN and password to access the student portal.</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="prn">
                    <i class="fas fa-qrcode"></i> PRN No.
                </label>
                <div class="input-wrapper">
                    <input type="text" id="prn" name="prn"
                        inputmode="numeric" maxlength="14"
                        placeholder="Enter your PRN number"
                        autocomplete="off">
                </div>
            </div>

            <div class="field">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password">
                    <button type="button" class="password-toggle" id="togglePassword"
                        tabindex="-1" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-arrow-right-to-bracket"></i> Login
            </button>
        </form>

        <div id="message" class="msg"></div>

        <div class="footer-simple">
            <i class="fas fa-shield"></i> Official student login · PRN required
        </div>
    </div>

</div>

<script src="student_login.js"></script>
</body>
</html>
