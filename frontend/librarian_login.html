<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Library Login · Library ID & Password</title>
    <!-- Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
   <link rel="stylesheet" href="librarian_login.css">
</head>
<body>
    <!-- background image + overlay -->
    <div class="bg-container">
        <img class="bg-img" src="../images/Librarian_Login_Image.jpeg" 
             alt="Library workspace – librarian login">
        <div class="bg-overlay"></div>
    </div>

    <!-- PAGE TITLE – icon and text separate -->
    <div class="page-title">
        <i class="fas fa-id-badge"></i> Librarian Login
    </div>

    <!-- LOGIN CARD -->
    <div class="login-card">
        <form id="loginForm" novalidate>
            <!-- Employee ID (or Librarian ID) -->
            <div class="field">
                <label for="employeeId">
                    <i class="fas fa-id-card"></i> Librarian ID
                </label>
                <div class="input-wrapper">
                    <input type="text" id="employeeId" name="employeeId" 
                           placeholder="Enter your librarian ID" autocomplete="off" spellcheck="false">
                </div>
            </div>

            <!-- Password with eye toggle -->
            <div class="field">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" 
                           placeholder="Enter your password" autocomplete="current-password">
                    <button type="button" class="password-toggle" id="togglePassword" tabindex="-1" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Login button -->
            <button type="submit" class="login-btn">
                <i class="fas fa-arrow-right-to-bracket"></i> LOGIN
            </button>
        </form>
        <div id="message" class="msg" style="display:none;"></div>
        <div class="footer-simple">
            <i class="fas fa-shield-halved"></i> Librarian portal · secure, transparent
        </div>
    </div>

    <script src="librarian_login.js"></script>
</body>
</html>
