<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal — Account Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="student.css">
    <style>
        /* ── Employee portal accent override: teal ── */
        :root {
            --accent:     #14B8A6;
            --accent-dim: rgba(20,184,166,0.12);
            --accent-2:   #0D9488;
            --sidebar-active: rgba(20,184,166,0.18);
        }
        .wel1 h2 span { color: #99F6E4; }
        .logo-icon { background: var(--accent); }
        .section-title i { color: var(--accent); }
        .update-btn { background: var(--accent); }
        .sidebar ul li.active { background: var(--sidebar-active); color: var(--accent); }
        .search-container input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo">
        <span class="logo-icon"><i class="fa-solid fa-briefcase"></i></span>
        <span style="font-family:var(--font-display);font-size:17px;font-weight:700;color:#fff;">Staff Portal</span>
    </div>
    <nav>
        <ul>
            <li onclick="navigateToPage('employee-page.html')">
                <i class="fa-solid fa-circle-user"></i><span>Profile</span>
            </li>
            <li class="active" onclick="navigateToPage('auth_changes_employee.html')">
                <i class="fa-solid fa-sliders"></i><span>Auth Changes</span>
            </li>
        </ul>
    </nav>
    <div class="logout" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
    </div>
</aside>

<div class="main-content">

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <button class="toggle_btn"><i class="fa-solid fa-bars"></i></button>
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search books…" autocomplete="off"/>
                <div id="suggestions" class="suggestions-box"></div>
            </div>
        </div>
        <div class="header-right">
            <div class="profile-chip">
                <div class="profile-avatar"><img src="../images/gcoeystu.png" alt="profile"></div>
                <div class="profile-info">
                    <strong id="short_name">Employee</strong>
                    <small><span id="department">—</span> Department</small>
                </div>
            </div>
        </div>
        <div class="dropdown_manue">
            <li onclick="navigateToPage('employee-page.html')"><i class="fa-solid fa-circle-user"></i>Profile</li>
            <li onclick="navigateToPage('auth_changes_employee.html')"><i class="fa-solid fa-sliders"></i>Auth Changes</li>
            <li onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>Logout</li>
        </div>
    </header>

    <!-- Welcome Banner (compact) -->
    <section class="welcome" style="padding:24px 32px;">
        <div class="wel1">
            <div>
                <p class="welcome-label">Account Settings</p>
                <h2>Update your <span id="first_name">information</span></h2>
                <p>Keep your contact details and credentials up to date.</p>
            </div>
        </div>
        <div class="wel2" style="padding:10px;">
            <img id="qrImage" alt="QR Code" style="width:90px;height:90px;"/>
        </div>
    </section>

    <!-- Update Email -->
    <section class="data-section" id="edit-profile">
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-envelope"></i>
                <h2>Update Email</h2>
            </div>
        </div>
        <div class="edit-container">
            <div class="update-row" style="padding-top:4px;">
                <div class="input-group">
                    <div class="form-group">
                        <label for="edit-email">New Email Address</label>
                        <input type="email" id="edit-email" placeholder="Enter new email address"/>
                    </div>
                </div>
                <button class="update-btn" onclick="updateEmail()">
                    <i class="fa-solid fa-floppy-disk"></i> Save Email
                </button>
            </div>
        </div>
    </section>

    <!-- Update Password -->
    <section class="data-section">
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-lock"></i>
                <h2>Update Password</h2>
            </div>
        </div>
        <div class="edit-container">
            <div class="update-row" style="padding-top:4px;">
                <div class="input-group">
                    <div class="form-group">
                        <label for="old-password">Current Password</label>
                        <input type="password" id="old-password" placeholder="Enter current password"/>
                    </div>
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" placeholder="Enter new password"/>
                    </div>
                </div>
                <button class="update-btn" onclick="updatePassword()">
                    <i class="fa-solid fa-floppy-disk"></i> Save Password
                </button>
            </div>
        </div>
    </section>

    <!-- Update Phone -->
    <section class="data-section">
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-mobile-screen"></i>
                <h2>Update Phone Number</h2>
            </div>
        </div>
        <div class="edit-container">
            <div class="update-row" style="padding-top:4px;">
                <div class="input-group">
                    <div class="form-group">
                        <label for="edit-phone">Phone Number</label>
                        <input type="tel" id="edit-phone" placeholder="Enter new phone number"/>
                    </div>
                </div>
                <button class="update-btn" onclick="updatePhone()">
                    <i class="fa-solid fa-floppy-disk"></i> Save Phone
                </button>
            </div>
        </div>
    </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="auth_changes_employee.js"></script>

</body>
</html>
